services:
  codex-meter:
    image: ghcr.io/xyzphp/codexmeter:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codex-meter
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      BIND_ADDR: 0.0.0.0:8123
    volumes:
      - ./config.json:/app/config.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
