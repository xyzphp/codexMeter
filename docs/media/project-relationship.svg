<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">codexMeter 与 xyzAiMeter 项目关系图</title>
  <desc id="desc">codexMeter 提供 Go 后端和 Web 监控页面，xyzAiMeter 通过 Android WebView 在 LX04 设备上加载和展示页面。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf5fb"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff7ef"/>
      <stop offset="1" stop-color="#b9e5d8"/>
    </linearGradient>
    <linearGradient id="android" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/>
      <stop offset="1" stop-color="#d3e3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d739f"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #17324d; }
      .subtitle { font-size: 23px; fill: #55718a; }
      .card-title { font-size: 36px; font-weight: 700; fill: #17324d; }
      .card-subtitle { font-size: 25px; fill: #35556e; }
      .body { font-size: 22px; fill: #35556e; }
      .label { font-size: 20px; font-weight: 700; fill: #3d739f; }
      .step { font-size: 24px; font-weight: 700; fill: #17324d; }
      .small { font-size: 21px; fill: #55718a; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1460" cy="90" r="190" fill="#dff2ff" opacity="0.55"/>
  <circle cx="120" cy="820" r="220" fill="#e4f7f1" opacity="0.65"/>

  <text x="800" y="78" text-anchor="middle" class="font title">codexMeter × xyzAiMeter</text>
  <text x="800" y="122" text-anchor="middle" class="font subtitle">后端监控服务与 Android WebView 客户端的协同关系</text>

  <g filter="url(#shadow)">
    <rect x="100" y="205" width="610" height="355" rx="30" fill="#ffffff" stroke="#9bd8c8" stroke-width="3"/>
    <rect x="890" y="205" width="610" height="355" rx="30" fill="#ffffff" stroke="#a9c7ec" stroke-width="3"/>
  </g>

  <!-- codexMeter card -->
  <circle cx="170" cy="282" r="35" fill="url(#backend)" stroke="#2c8a79" stroke-width="3"/>
  <text x="170" y="294" text-anchor="middle" class="font card-title" font-size="30">1</text>
  <text x="230" y="286" class="font card-title">codexMeter</text>
  <text x="145" y="348" class="font card-subtitle">Go 后端 + Web 监控页面</text>
  <text x="145" y="402" class="font body">• 查询 ChatGPT/Codex 额度与使用统计</text>
  <text x="145" y="442" class="font body">• 调用上游接口并整理为监控页面</text>
  <text x="145" y="482" class="font body">• 提供 URL、Basic Auth 和代理配置</text>
  <rect x="145" y="510" width="520" height="18" rx="9" fill="#d3eee7"/>
  <rect x="145" y="510" width="360" height="18" rx="9" fill="#30a58b"/>

  <!-- xyzAiMeter card -->
  <circle cx="960" cy="282" r="35" fill="url(#android)" stroke="#4776b1" stroke-width="3"/>
  <text x="960" y="294" text-anchor="middle" class="font card-title" font-size="30">2</text>
  <text x="1020" y="286" class="font card-title">xyzAiMeter</text>
  <text x="935" y="348" class="font card-subtitle">Android WebView 壳应用</text>
  <text x="935" y="402" class="font body">• 安装到 LX04 Android 设备</text>
  <text x="935" y="442" class="font body">• 在设置页填写 codexMeter URL</text>
  <text x="935" y="482" class="font body">• 配置 Basic Auth 并全屏展示页面</text>
  <rect x="935" y="510" width="520" height="18" rx="9" fill="#dbe9fb"/>
  <rect x="935" y="510" width="405" height="18" rx="9" fill="#5b8fd0"/>

  <!-- relationship arrow -->
  <path d="M710 382 C770 382 830 382 890 382" fill="none" stroke="#3d739f" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="800" y="350" text-anchor="middle" class="font label">部署地址 + Basic Auth</text>
  <text x="800" y="424" text-anchor="middle" class="font small">WebView 加载</text>

  <!-- deployment flow -->
  <rect x="100" y="650" width="1400" height="155" rx="30" fill="#ffffff" stroke="#c2d7e8" stroke-width="3" filter="url(#shadow)"/>
  <text x="145" y="700" class="font step">完整使用流程</text>

  <g>
    <rect x="145" y="730" width="250" height="48" rx="24" fill="#edf9f5" stroke="#84cbbb" stroke-width="2"/>
    <text x="270" y="762" text-anchor="middle" class="font small">ChatGPT/Codex API</text>
    <path d="M405 754 L475 754" fill="none" stroke="#3d739f" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="495" y="730" width="250" height="48" rx="24" fill="#dff7ef" stroke="#84cbbb" stroke-width="2"/>
    <text x="620" y="762" text-anchor="middle" class="font small">codexMeter 服务</text>
    <path d="M755 754 L825 754" fill="none" stroke="#3d739f" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="845" y="730" width="250" height="48" rx="24" fill="#e8f1ff" stroke="#9bbbe5" stroke-width="2"/>
    <text x="970" y="762" text-anchor="middle" class="font small">xyzAiMeter WebView</text>
    <path d="M1105 754 L1175 754" fill="none" stroke="#3d739f" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="1195" y="730" width="250" height="48" rx="24" fill="#f2eaff" stroke="#c4ace2" stroke-width="2"/>
    <text x="1320" y="762" text-anchor="middle" class="font small">LX04 横屏设备</text>
  </g>

  <text x="800" y="858" text-anchor="middle" class="font subtitle">先部署 codexMeter，再在 xyzAiMeter 中配置页面地址和认证信息</text>
</svg>
