<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">codexMeter 项目架构与交互逻辑</title>
  <desc id="desc">xyzAiMeter Android WebView 访问 codexMeter，codexMeter 经过认证、缓存和代理后请求 ChatGPT Wham 接口及 Codex Reset 公共接口，并将数据返回页面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e8ff"/>
      <stop offset="1" stop-color="#ddd0f5"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff7ef"/>
      <stop offset="1" stop-color="#bce6da"/>
    </linearGradient>
    <linearGradient id="upstream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/>
      <stop offset="1" stop-color="#cddff6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d739f"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c8a79"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #17324d; }
      .subtitle { font-size: 22px; fill: #55718a; }
      .lane-title { font-size: 24px; font-weight: 700; fill: #35556e; }
      .card-title { font-size: 30px; font-weight: 700; fill: #17324d; }
      .card-subtitle { font-size: 21px; fill: #35556e; }
      .body { font-size: 18px; fill: #35556e; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 17px; fill: #244b67; }
      .label { font-size: 17px; font-weight: 700; fill: #3d739f; }
      .small { font-size: 16px; fill: #55718a; }
      .note { font-size: 18px; fill: #6d4b1f; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1490" cy="80" r="180" fill="#dff2ff" opacity="0.55"/>
  <circle cx="100" cy="910" r="220" fill="#e4f7f1" opacity="0.65"/>

  <text x="800" y="62" text-anchor="middle" class="font title">codexMeter 项目架构与交互逻辑</text>
  <text x="800" y="100" text-anchor="middle" class="font subtitle">设备请求 → 后端认证与缓存 → 上游数据源 → JSON 页面渲染</text>

  <!-- Client lane -->
  <rect x="55" y="145" width="1490" height="250" rx="28" fill="#ffffff" stroke="#d0dfea" stroke-width="2"/>
  <text x="90" y="185" class="font lane-title">一、页面访问与用户交互</text>

  <g filter="url(#shadow)">
    <rect x="95" y="215" width="360" height="135" rx="22" fill="url(#client)" stroke="#a88acf" stroke-width="3"/>
    <rect x="620" y="215" width="430" height="135" rx="22" fill="url(#server)" stroke="#82cbbb" stroke-width="3"/>
    <rect x="1215" y="215" width="260" height="135" rx="22" fill="#fff8e8" stroke="#e3bb70" stroke-width="3"/>
  </g>
  <text x="125" y="255" class="font card-title">xyzAiMeter</text>
  <text x="125" y="285" class="font card-subtitle">Android WebView / LX04</text>
  <text x="125" y="318" class="font body">加载页面、设置 URL、Basic Auth</text>

  <text x="650" y="255" class="font card-title">codexMeter HTTP Server</text>
  <text x="650" y="285" class="font card-subtitle">内嵌 index.html / settings.html</text>
  <text x="650" y="318" class="font code">GET / · /settings · /audio</text>

  <text x="1245" y="255" class="font card-title">用户操作</text>
  <text x="1245" y="285" class="font card-subtitle">刷新 / 切换页面</text>
  <text x="1245" y="318" class="font body">额度、详情、预测、配置</text>

  <path d="M455 282 L620 282" fill="none" stroke="#3d739f" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="537" y="257" text-anchor="middle" class="font label">HTTP(S)</text>
  <path d="M1215 282 L1050 282" fill="none" stroke="#3d739f" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="1132" y="257" text-anchor="middle" class="font label">点击与刷新</text>

  <!-- Backend lane -->
  <rect x="55" y="425" width="1490" height="275" rx="28" fill="#ffffff" stroke="#d0dfea" stroke-width="2"/>
  <text x="90" y="465" class="font lane-title">二、codexMeter 后端处理</text>

  <g filter="url(#shadow)">
    <rect x="95" y="495" width="320" height="145" rx="22" fill="#f1f7fc" stroke="#b8d1e5" stroke-width="3"/>
    <rect x="505" y="495" width="500" height="145" rx="22" fill="url(#server)" stroke="#82cbbb" stroke-width="3"/>
    <rect x="1095" y="495" width="380" height="145" rx="22" fill="#f1f7fc" stroke="#b8d1e5" stroke-width="3"/>
  </g>
  <text x="125" y="535" class="font card-title">认证与路由</text>
  <text x="125" y="568" class="font body">Basic Auth / API Key</text>
  <text x="125" y="600" class="font body">Base Path / CORS / 错误处理</text>

  <text x="535" y="535" class="font card-title">Usage Service</text>
  <text x="535" y="568" class="font code">/api/usage · /api/usage/analytics</text>
  <text x="535" y="600" class="font code">/api/prediction · /api/config</text>
  <text x="535" y="630" class="font body">Cache TTL · 强制刷新 · JSON 聚合</text>

  <text x="1125" y="535" class="font card-title">配置与网络</text>
  <text x="1125" y="568" class="font body">config.json / 环境变量</text>
  <text x="1125" y="600" class="font body">OAuth Token · Account ID · Proxy</text>
  <text x="1125" y="630" class="font body">凭证只在后端使用</text>

  <path d="M415 568 L505 568" fill="none" stroke="#3d739f" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M1095 568 L1005 568" fill="none" stroke="#3d739f" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- Upstream lane -->
  <rect x="55" y="730" width="1490" height="205" rx="28" fill="#ffffff" stroke="#d0dfea" stroke-width="2"/>
  <text x="90" y="770" class="font lane-title">三、上游请求与页面更新</text>

  <g filter="url(#shadow)">
    <rect x="95" y="800" width="580" height="95" rx="20" fill="url(#upstream)" stroke="#9bbbe5" stroke-width="3"/>
    <rect x="785" y="800" width="350" height="95" rx="20" fill="#eefaf6" stroke="#9bd8c8" stroke-width="3"/>
    <rect x="1245" y="800" width="230" height="95" rx="20" fill="#fff8e8" stroke="#e3bb70" stroke-width="3"/>
  </g>
  <text x="125" y="833" class="font card-title" font-size="24">上游数据源</text>
  <text x="125" y="862" class="font code">ChatGPT Wham API · usage / daily usage</text>
  <text x="125" y="885" class="font code">codex-resets.com · /api/v1/status</text>

  <text x="815" y="833" class="font card-title" font-size="24">后端聚合与缓存</text>
  <text x="815" y="866" class="font code">Wham JSON · Prediction JSON</text>

  <text x="1275" y="833" class="font card-title" font-size="24">页面更新</text>
  <text x="1275" y="866" class="font body">图表 · 倒计时 · 提示音</text>

  <path d="M675 848 L785 848" fill="none" stroke="#2c8a79" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <path d="M1135 848 L1245 848" fill="none" stroke="#3d739f" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="720" y="820" text-anchor="middle" class="font label">HTTPS + Proxy</text>
  <text x="1190" y="820" text-anchor="middle" class="font label">JSON 返回</text>

  <text x="800" y="970" text-anchor="middle" class="font note">自动刷新到点后，前端请求 /api/usage 和 /api/usage/analytics；预测页按需请求 /api/prediction</text>
</svg>
