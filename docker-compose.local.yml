services:
  codex-meter:
    image: codex-meter:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${CODEX_METER_VERSION:-dev}
        APP_COMMIT: ${CODEX_METER_COMMIT:-unknown}
        APP_BUILD_TIME: ${CODEX_METER_BUILD_TIME:-}
    container_name: codex-meter-local
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      BIND_ADDR: 0.0.0.0:8123
      CONFIG_FILE: /app/config/config.json
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
