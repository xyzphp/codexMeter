openapi: 3.0.3
info:
  title: Codex Usage Dashboard API
  version: 1.0.0
  description: |
    当前项目的本地管理 API。服务端使用配置的 ChatGPT OAuth Bearer Token
    读取 wham/usage 和统计接口，前端或其他客户端只需要调用本项目的
    /api/* 接口，不需要直接接触 OAuth 凭证。

    这不是 OpenAI 官方 API，也不是聊天请求代理；它只提供额度、统计、预测、
    配置和提示音资源。

    所有 HTTP 响应都会通过 X-Codex-Meter-Version、X-Codex-Meter-Commit
    和 X-Codex-Meter-Build-Time 响应头提供当前构建标识。
servers:
  - url: http://127.0.0.1:8123
    description: 本地服务示例
  - url: https://codex.your-domain.invalid/codex
    description: 通过反向代理发布时的示例地址，请替换域名和路径
tags:
  - name: service
    description: 服务健康检查
  - name: usage
    description: 当前额度和统计数据
  - name: prediction
    description: 公共重置预测数据
  - name: accounts
    description: 多账号配置、监控和默认账号切换
  - name: config
    description: 服务端运行配置
  - name: assets
    description: 前端资源
paths:
  /healthz:
    get:
      tags: [service]
      operationId: healthCheck
      summary: 健康检查
      description: 返回服务状态、版本、Git 提交和构建时间，用于确认实例是否已经更新。
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: v1.0.7
                commit: abcdef1234567890
                build_time: '2026-09-12T06:45:00Z'

  /api/usage:
    get:
      tags: [usage]
      operationId: getUsage
      summary: 获取当前额度
      description: |
        account_id 为本项目账号 id；省略或空字符串时固定读取主账号，与页面 active_account_id 无关。
        旧调用保留原响应字段；只有显式指定 account_id 的响应包含 account_id、account_name。
        每个账号的凭证、代理、缓存和历史独立。
        服务端读取 ChatGPT 的 wham/usage，并转换为前端使用的稳定结构。
        force=true 会绕过本地缓存并立即请求上游；省略 force 或设为 false
        时使用服务端缓存策略。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/Force'
      responses:
        '200':
          description: 当前额度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AccountConflict'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/usage/analytics:
    get:
      tags: [usage]
      operationId: getUsageAnalytics
      summary: 获取日期范围使用统计
      description: |
        account_id 为本项目账号 id；省略或空字符串时固定读取主账号，与页面 active_account_id 无关。
        旧调用保留原响应字段；只有显式指定 account_id 的响应包含 account_id、account_name。
        每个账号的凭证、代理、缓存和历史独立。
        服务端聚合指定日期范围的 daily-token-usage-breakdown 和
        daily-workspace-usage-counts 数据，返回每日 token、额度、工作区统计以及按模型的使用占比。
        未提供日期范围时兼容返回最近七个已完成日期（不包含今天）；上游统计不可用时返回 502。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/AnalyticsStartDate'
        - $ref: '#/components/parameters/AnalyticsEndDate'
        - $ref: '#/components/parameters/Force'
      responses:
        '200':
          description: 指定日期范围统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageAnalytics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AccountConflict'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: 获取脱敏账号列表
      description: 返回账号名称、凭证配置状态和默认账号；不请求上游，不返回 OAuth Token 或 Cookie 原文。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [accounts]
      operationId: createAccount
      summary: 新增监控账号
      description: 使用独立凭证新增账号（最多 32 个），服务端生成本地 id。需要 access_token 和 chatgpt_account_id；首次配置时自动设为页面展示账号。未提供请求上下文时使用默认值，代理默认直连，不继承当前账号的凭证或代理。保存不触发上游请求，可先调用配置测试接口。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '201':
          description: 新增成功，返回完整脱敏列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/accounts/usage:
    get:
      tags: [accounts]
      operationId: getAccountsUsage
      summary: 获取所有账号额度
      description: 最多并发查询 4 个账号，返回各自额度、缓存状态和错误。单个账号失败不会影响其他账号，整体仍返回 200；存在最近快照时返回 usage 并标记 stale=true 与 error。后台每 5 分钟分别采样所有已配置账号。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      parameters:
        - $ref: '#/components/parameters/Force'
      responses:
        '200':
          description: 多账号额度与逐账号状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsUsageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/accounts/active:
    put:
      tags: [accounts]
      operationId: switchActiveAccount
      summary: 切换页面展示账号
      description: 保存 active_account_id 并立即更新页面展示。页面显式传 account_id 读取所选账号；未传账号的旧应用 API 始终使用主账号。切换不会更换主账号凭证、代理、缓存或公共预测缓存。所有账号仍独立采样，不修改 Codex CLI 登录。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSwitch'
      responses:
        '200':
          description: 已切换，返回完整脱敏列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AccountConflict'

  /api/accounts/{account_id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: 本项目账号 id，从账号列表中获取。
        schema:
          type: string
    put:
      tags: [accounts]
      operationId: updateAccount
      summary: 更新账号名称或凭证
      description: 部分更新指定账号，未提供字段保持不变。修改凭证仅使该账号缓存失效；chatgpt_account_id 改变时须新增账号以保留独立历史。代理及其认证属于指定账号；修改代理只使该账号缓存失效。缓存时间和管理认证为全局设置。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: 已更新，返回完整脱敏列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: 删除监控账号
      description: 移除账号凭证和运行时缓存，保留数据库历史归档。删除当前账号后默认切换到列表中第一个账号；禁止删除主账号或最后一个账号，返回 409。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      responses:
        '200':
          description: 已删除，返回剩余脱敏列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AccountConflict'

  /api/prediction:
    get:
      tags: [prediction]
      operationId: getResetPrediction
      summary: 获取重置预测
      description: |
        从 codex-resets.com 的公开状态 API 读取最新已执行重置、scheduled_reset（已公告待执行重置）、active_watch 和统计数据。
        已排期重置没有预测概率或社区投票；即使 scheduled_for 已过，也必须等待上游确认执行。
        未排期时补充读取首页社区投票。历史记录或首页暂时不可用时仍返回状态 API 的信号数据。
        该数据是公共预测信息，不代表当前账户已经完成额度重置。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      parameters:
        - $ref: '#/components/parameters/Force'
      responses:
        '200':
          description: 重置预测数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPrediction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: 获取非敏感配置
      description: |
        返回当前运行配置。OAuth Token 不会原文返回，只返回 token_configured
        和 token_hint。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      responses:
        '200':
          description: 非敏感配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigView'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [config]
      operationId: updateConfig
      summary: 更新运行配置
      description: |
        部分更新配置。未提供的字段保持原值。access_token 和
        chatgpt_account_id 必须同时有效，否则服务端拒绝保存。cache_ttl 使用
        Go duration 格式，例如 10m、30s 或 0。代理与凭证按 account_id 更新，
        省略时固定使用主账号；代理用户名和密码通过 proxy_username、proxy_password 设置。
        省略密码保留已有值，proxy_clear_auth=true 清除认证。缓存时间和管理认证为全局设置。
        首次配置时允许先保存代理再填写账号凭证。

        请求中的 access_token 会写入服务端配置文件，请仅从可信的管理端调用，
        不要把它放进浏览器端代码、日志或 URL。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
            example:
              access_token: eyJhbGciOi...
              chatgpt_account_id: 00000000-0000-0000-0000-000000000000
              user_agent: codex-meter/1.0
              proxy_url: http://127.0.0.1:7890
              cache_ttl: 10m
              fedramp: false
      responses:
        '200':
          description: 更新后的非敏感配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/config/app-key:
    get:
      tags: [config]
      operationId: getAppAPIKey
      summary: 读取当前 App API Key
      description: |
        在已经通过 Basic Auth 或 App API Key 认证的情况下，返回当前维护的
        App API Key，供受保护的接口调试页面使用。响应设置为 no-store；请勿
        把返回值写入日志、URL 或前端源码。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      responses:
        '200':
          description: 当前管理密钥
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppAPIKeyView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/config/file:
    get:
      tags: [config]
      operationId: getConfigFile
      summary: 读取原始配置文件
      description: |
        返回服务端 config.json 的原文内容。该接口包含 OAuth Token、Cookie
        等敏感凭证，必须受 Basic Auth 或 App API Key 保护；在两者均未启用时
        服务端直接拒绝访问（403）。请勿把响应内容写入日志、URL 或前端源码。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      responses:
        '200':
          description: 配置文件原文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigFileView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 未启用任何管理认证，配置文件接口拒绝访问。
        '500':
          description: 服务端读取配置文件失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [config]
      operationId: updateConfigFile
      summary: 校验并保存原始配置文件
      description: |
        用请求体中的 content 整体替换服务端 config.json。内容必须是合法的
        配置 JSON，服务端会先写入临时文件完成完整性与凭证校验，再落盘并立即
        重新加载运行配置。修改 bind_addr 或 base_path 后需要重启服务才会生效。
        请仅从可信的管理端调用，不要把响应内容写入日志、URL 或前端源码。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigFileUpdate'
            example:
              content: '{"cache_ttl":"10m"}'
      responses:
        '200':
          description: 保存后的配置文件原文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigFileView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 未启用任何管理认证，配置文件接口拒绝访问。

  /api/config/test:
    post:
      tags: [config]
      operationId: testConfig
      summary: 临时测试 OpenAI 额度连接
      description: |
        使用请求体中的临时配置与当前配置合并，请求一次 ChatGPT Web 的
        /backend-api/wham/usage。测试不会写入 config.json，也不会返回完整
        OAuth Token 或 Cookie。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '200':
          description: 测试成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/config/test-proxy:
    post:
      tags: [config]
      operationId: testProxy
      summary: 测试上游代理连接
      description: |
        使用请求体中的 proxy_url 临时访问 ChatGPT 首页，用于在填写账号凭证前
        验证直连或 HTTP、HTTPS、SOCKS5 代理是否可用。account_id 指定账号，省略时固定使用主账号，
        显式空字符串测试独立的新账号网络草稿。proxy_url 省略时测试该账号已保存的代理，
        空字符串表示直连。proxy_username 与 proxy_password 可设置代理认证，省略密码保留
        该账号已保存的密码；proxy_clear_auth=true 清除认证。所有 ChatGPT HTTP 状态均表示
        网络已连通，状态码在响应中返回；只有连接失败返回 502。测试不会写入 config.json，
        也不会发送或返回 OAuth Token、Cookie。
      security:
        - basicAuth: []
        - appApiKey: []
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyTestRequest'
            example:
              account_id: default
              proxy_url: http://127.0.0.1:7890
      responses:
        '200':
          description: 代理连接测试成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /audio:
    get:
      tags: [assets]
      operationId: getAudio
      summary: 获取内置提示音
      description: |
        返回嵌入在前端页面中的 WAV 提示音。kind 为 normal、warning 或 critical。
        此资源不需要 app API key，但如果服务启用了 Basic Auth，仍然需要 Basic Auth。
      security:
        - basicAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          description: 提示音级别
          schema:
            type: string
            enum: [normal, warning, critical]
      responses:
        '200':
          description: WAV 音频
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 服务端启用 Basic Auth 时使用。
    appApiKey:
      type: apiKey
      in: header
      name: X-App-API-Key
      description: 配置 app_api_key 后使用的管理密钥。
    appBearer:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: "与 X-App-API-Key 等价的 Authorization: Bearer 方式。"

  parameters:
    AccountID:
      name: account_id
      in: query
      required: false
      description: 本项目账号 id，省略或空字符串时固定使用主账号（优先 id=default，否则 accounts 的第一个账号）；页面展示切换不会改变该默认值。
      schema:
        type: string
    AnalyticsStartDate:
      name: start_date
      in: query
      required: false
      description: 统计起始日期，格式为 YYYY-MM-DD。与 end_date 同时提供时生效。
      schema:
        type: string
        format: date
      example: 2026-08-01
    AnalyticsEndDate:
      name: end_date
      in: query
      required: false
      description: 统计结束日期，格式为 YYYY-MM-DD，不能晚于当前日期；与 start_date 同时提供时生效。
      schema:
        type: string
        format: date
      example: 2026-08-30
    Force:
      name: force
      in: query
      required: false
      description: 是否绕过本地缓存直接请求上游。
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: 请求参数或配置无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: force must be true or false
    Unauthorized:
      description: 未通过认证或未提供管理密钥
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
    UpstreamError:
      description: 上游额度、统计或预测服务请求失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountConflict:
      description: 显式指定的账号凭证未配置完整，或尝试删除主账号、最后一个账号
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在或 kind 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      required: [status, version, commit, build_time]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          description: 构建时注入的服务版本；未注入时为 dev。
          example: v1.0.7
        commit:
          type: string
          description: 构建对应的完整 Git 提交；无法识别时为 unknown。
          example: abcdef1234567890
        build_time:
          type: string
          description: UTC 构建时间；未注入时为 unknown。
          example: '2026-09-12T06:45:00Z'

    Window:
      type: object
      required: [used_percent, reset_at, remaining_seconds]
      properties:
        used_percent:
          type: number
          format: double
          description: 当前窗口已使用百分比，0 到 100。
        window_minutes:
          type: integer
          description: 窗口长度（分钟）。
        reset_after_seconds:
          type: integer
          description: 上游返回的距离重置秒数。
        reset_at:
          type: string
          format: date-time
        remaining_seconds:
          type: integer
          format: int64
          description: 服务端计算的距离重置剩余秒数。

    Credits:
      type: object
      properties:
        has_credits:
          type: boolean
        unlimited:
          type: boolean
        overage_limit_reached:
          type: boolean
        balance:
          description: 上游返回的余额值，通常是字符串。
        approx_local_messages:
          type: array
          items: {type: integer}
        approx_cloud_messages:
          type: array
          items: {type: integer}

    SpendControl:
      type: object
      properties:
        reached:
          type: boolean
        individual_limit: {}

    ResetCredits:
      type: object
      properties:
        available_count:
          type: integer
        applicable_available_count:
          type: integer

    HistoryPoint:
      type: object
      required: [at, used_percent]
      properties:
        at:
          type: string
          format: date-time
        used_percent:
          type: number
          format: double
          description: 采样时本周窗口已使用百分比。
        five_hour_used_percent:
          type: number
          format: double
          nullable: true
          description: 采样时 5 小时窗口已使用百分比；旧日志记录可能没有该字段。
        stale:
          type: boolean
          description: 上游采集异常时是否沿用了最近一次成功采集的数据。

    UsageResponse:
      type: object
      required: [source, rate_limit_allowed, rate_limit_reached, fetched_at, from_cache]
      properties:
        account_id:
          type: string
          description: 数据所属的本项目账号 id，仅在显式指定 account_id 时返回；旧调用省略以保持响应格式。
        account_name:
          type: string
        source:
          type: string
          example: wham_usage
        plan_type:
          type: string
          example: plus
        email:
          type: string
          format: email
        rate_limit_allowed:
          type: boolean
        rate_limit_reached:
          type: boolean
        rate_limit_reached_type:
          type: string
        credits:
          allOf:
            - $ref: '#/components/schemas/Credits'
        spend_control:
          allOf:
            - $ref: '#/components/schemas/SpendControl'
        rate_limit_reset_credits:
          allOf:
            - $ref: '#/components/schemas/ResetCredits'
        fetched_at:
          type: string
          format: date-time
        from_cache:
          type: boolean
        five_hour:
          allOf:
            - $ref: '#/components/schemas/Window'
        seven_day:
          allOf:
            - $ref: '#/components/schemas/Window'
        history:
          type: array
          description: 兼容字段，返回周额度和 5 小时额度独立时间线的合并结果，按采样时间升序排列；合并结果最多包含 96 条记录。新客户端应使用 weekly_history 和 five_hour_history。
          items:
            $ref: '#/components/schemas/HistoryPoint'
        weekly_history:
          type: array
          description: 从完整定时采样归档计算的周额度独立时间线，先按自身 used_percent 去重并优先保留每个百分比最近的正常采样（没有正常采样时保留最近降级采样），再按采样时间升序返回最近最多 48 个不同百分比；不受 5 小时额度变化影响。
          items:
            $ref: '#/components/schemas/HistoryPoint'
        five_hour_history:
          type: array
          description: 从完整定时采样归档计算的 5 小时额度独立时间线，先按自身 five_hour_used_percent 去重并优先保留每个百分比最近的正常采样（没有正常采样时保留最近降级采样），再按采样时间升序返回最近最多 48 个不同百分比；不受周额度变化影响。
          items:
            $ref: '#/components/schemas/HistoryPoint'

    UsageAnalyticsModel:
      type: object
      required: [model, usage_percent]
      properties:
        model:
          type: string
        usage_percent:
          type: number
          format: double

    UsageAnalyticsDay:
      type: object
      required: [date, token_usage_percent, credits, users, threads, turns, text_total_tokens]
      properties:
        date:
          type: string
          description: 日期，格式通常为 YYYY-MM-DD。
        token_usage_percent:
          type: number
          format: double
        credits:
          type: number
          format: double
        users:
          type: integer
          format: int64
        threads:
          type: integer
          format: int64
        turns:
          type: integer
          format: int64
        uncached_text_input_tokens:
          type: integer
          format: int64
        cached_text_input_tokens:
          type: integer
          format: int64
        text_output_tokens:
          type: integer
          format: int64
        text_total_tokens:
          type: integer
          format: int64
        models:
          type: array
          items:
            $ref: '#/components/schemas/UsageAnalyticsModel'

    UsageAnalyticsSummary:
      type: object
      required: [token_usage_percent, credits, users, threads, turns, text_total_tokens]
      properties:
        token_usage_percent:
          type: number
          format: double
        credits:
          type: number
          format: double
        users:
          type: integer
          format: int64
        threads:
          type: integer
          format: int64
        turns:
          type: integer
          format: int64
        text_total_tokens:
          type: integer
          format: int64

    UsageAnalytics:
      type: object
      required: [source, fetched_at, from_cache, start_date, end_date, days, summary]
      properties:
        account_id:
          type: string
          description: 数据所属的本项目账号 id，仅在显式指定 account_id 时返回；旧调用省略以保持响应格式。
        account_name:
          type: string
        source:
          type: string
          example: wham_daily_usage
        fetched_at:
          type: string
          format: date-time
        from_cache:
          type: boolean
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/UsageAnalyticsDay'
        summary:
          $ref: '#/components/schemas/UsageAnalyticsSummary'

    ResetSource:
      type: object
      properties:
        type:
          type: string
        author:
          type: string
        url:
          type: string
          format: uri

    ResetEvent:
      type: object
      required: [id, reset_type, announced_at, text]
      properties:
        id:
          type: string
        reset_type:
          type: string
        announced_at:
          type: string
          format: date-time
        text:
          type: string
        source:
          allOf:
            - $ref: '#/components/schemas/ResetSource'

    ScheduledReset:
      allOf:
        - $ref: '#/components/schemas/ResetEvent'
        - type: object
          required: [status, scheduled_for]
          description: 明确公告但尚未确认执行的重置，不计入已执行重置历史和统计；计划时间已过不代表已执行。
          properties:
            status:
              type: string
              enum: [scheduled]
            scheduled_for:
              type: string
              format: date-time
              nullable: true
              description: 计划执行时间（UTC）；为空表示尚未公布具体时间。

    ResetWatch:
      type: object
      properties:
        reset_chance_percent:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
          description: 模型预测概率；为空表示上游未提供概率，不能解释为 0%。
        forecast_window:
          type: string
        observed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        level:
          type: string
        text:
          type: string
        source:
          $ref: '#/components/schemas/ResetSource'

    ResetPoll:
      type: object
      required: [yes_votes, no_votes, total_votes, yes_percent]
      description: codex-resets.com 首页的社区投票统计；yes_percent 是赞成票在全部投票中的占比。
      properties:
        yes_votes:
          type: integer
          minimum: 0
        no_votes:
          type: integer
          minimum: 0
        total_votes:
          type: integer
          minimum: 0
        yes_percent:
          type: number
          format: double

    ResetStats:
      type: object
      required: [total, last_reset_at, days_since_last, avg_interval_days]
      properties:
        total:
          type: integer
        last_reset_at:
          type: string
          format: date-time
        days_since_last:
          type: number
          format: double
        avg_interval_days:
          type: number
          format: double

    ResetPrediction:
      type: object
      required: [source, fetched_at, from_cache, stats]
      properties:
        source:
          type: string
          example: codex_resets_status
        fetched_at:
          type: string
          format: date-time
        from_cache:
          type: boolean
        latest_reset:
          allOf:
            - $ref: '#/components/schemas/ResetEvent'
          description: 最新已执行的公共重置，尚未执行的公告通过 scheduled_reset 返回。
        scheduled_reset:
          allOf:
            - $ref: '#/components/schemas/ScheduledReset'
        active_watch:
          allOf:
            - $ref: '#/components/schemas/ResetWatch'
        community_poll:
          allOf:
            - $ref: '#/components/schemas/ResetPoll'
        history:
          type: array
          description: codex-resets.com 返回的 Reset 历史记录，按公告时间倒序排列。
          items:
            $ref: '#/components/schemas/ResetEvent'
        stats:
          $ref: '#/components/schemas/ResetStats'

    ConfigView:
      type: object
      required:
        - primary_account_id
        - app_api_key_configured
        - basic_auth_enabled
        - basic_auth_password_configured
        - chatgpt_account_id
        - user_agent
        - fedramp
        - token_configured
        - cookie_configured
        - proxy_password_configured
        - cache_ttl
        - config_file
        - setup_required
      properties:
        active_account_id:
          type: string
          description: 页面持久化展示的账号，独立于旧应用 API 默认账号。
        primary_account_id:
          type: string
          description: 旧应用 API 固定使用的主账号；优先 id=default，否则为账号列表第一项。
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountView'
        app_api_key_configured:
          type: boolean
        app_api_key_hint:
          type: string
          description: 仅返回 App API Key 的脱敏提示，不返回密钥原文。
        basic_auth_enabled:
          type: boolean
        basic_auth_username:
          type: string
        basic_auth_password_configured:
          type: boolean
        chatgpt_account_id:
          type: string
        user_agent:
          type: string
        fedramp:
          type: boolean
        token_configured:
          type: boolean
        token_hint:
          type: string
          description: 仅显示 Token 最后四位的脱敏提示。
        cookie_configured:
          type: boolean
        cookie_hint:
          type: string
          description: 仅返回 Cookie 的配置项数，不返回 Cookie 原文。
        client_build_number:
          type: string
        client_version:
          type: string
        device_id:
          type: string
        session_id:
          type: string
        client_observation:
          type: string
        referer:
          type: string
        proxy_url:
          type: string
          format: uri
          description: 主账号的上游代理 URL。内嵌密码脱敏为 ****；可通过账号设置表单修改认证，原文仅保存在服务端。
        cache_ttl:
          type: string
          example: 5m0s
        config_file:
          type: string
        setup_required:
          type: boolean
          description: 主账号凭证未完成时为 true，旧应用请求返回 502；首页按页面展示账号决定是否显示配置引导。

        proxy_password_configured:
          type: boolean
          description: 该账号是否已保存代理密码，不返回密码原文。

    AccountView:
      type: object
      required: [id, name, active, primary, token_configured, cookie_configured, setup_required, proxy_password_configured]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
        primary:
          type: boolean
          description: 是否为兼容旧应用 API 的固定主账号，主账号不能通过账号删除接口移除。
        token_configured:
          type: boolean
        token_hint:
          type: string
          description: Token 的脱敏提示，仅包含末四位。
        cookie_configured:
          type: boolean
        chatgpt_account_id:
          type: string
        user_agent:
          type: string
        fedramp:
          type: boolean
        client_build_number:
          type: string
        client_version:
          type: string
        device_id:
          type: string
        session_id:
          type: string
        client_observation:
          type: string
        referer:
          type: string
        setup_required:
          type: boolean
        proxy_url:
          type: string
          description: 该账号独立的代理 URL，密码以 **** 脱敏；为空或省略表示直连。

        proxy_password_configured:
          type: boolean
          description: 该账号是否已保存代理密码，不返回密码原文。

    AccountsView:
      type: object
      required: [active_account_id, primary_account_id, accounts]
      properties:
        active_account_id:
          type: string
          description: 页面持久化展示的账号，独立于旧应用 API 默认账号。
        primary_account_id:
          type: string
          description: 旧应用 API 固定使用的主账号；优先 id=default，否则为账号列表第一项。
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountView'
    AccountUpdate:
      type: object
      description: 新增时必须提供 access_token 和 chatgpt_account_id；更新时未提供字段保持不变。仅接收账号相关字段。
      properties:
        name:
          type: string
          maxLength: 80
        access_token:
          type: string
          writeOnly: true
        cookie:
          type: string
          writeOnly: true
        chatgpt_account_id:
          type: string
        user_agent:
          type: string
        fedramp:
          type: boolean
        client_build_number:
          type: string
        client_version:
          type: string
        device_id:
          type: string
        session_id:
          type: string
        client_observation:
          type: string
        referer:
          type: string
        proxy_url:
          type: string
          description: 该账号的代理 URL，支持 http、https、socks5；空字符串明确选择直连。省略保持不变，地址不带认证时保留已有认证。
        proxy_username:
          type: string
          writeOnly: true
          description: 代理认证用户名。更改用户名时应同时提供新密码。
        proxy_password:
          type: string
          writeOnly: true
          description: 代理认证密码，支持特殊字符，无需 URL 编码。省略保留已有密码，空字符串明确设置空密码；响应不回显。
        proxy_clear_auth:
          type: boolean
          default: false
          description: 为 true 时清除该账号的代理认证，不能同时提供非空用户名或密码。

    AccountSwitch:
      type: object
      required: [account_id]
      properties:
        account_id:
          type: string
      example:
        account_id: default
    AccountUsage:
      type: object
      required: [id, name, active, primary, stale]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
        primary:
          type: boolean
          description: 是否为兼容旧应用 API 的固定主账号，主账号不能通过账号删除接口移除。
        stale:
          type: boolean
          description: 上游失败且 usage 是最近缓存快照时为 true。
        error:
          type: string
        usage:
          $ref: '#/components/schemas/UsageResponse'
    AccountsUsageResponse:
      type: object
      required: [active_account_id, primary_account_id, accounts]
      properties:
        active_account_id:
          type: string
          description: 页面持久化展示的账号，独立于旧应用 API 默认账号。
        primary_account_id:
          type: string
          description: 旧应用 API 固定使用的主账号；优先 id=default，否则为账号列表第一项。
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountUsage'

    AppAPIKeyView:
      type: object
      required: [configured, app_api_key]
      properties:
        configured:
          type: boolean
        app_api_key:
          type: string
          readOnly: true
          description: 当前 App API Key；仅对已认证请求返回，响应不缓存。

    ConfigFileView:
      type: object
      required: [config_file, content]
      properties:
        config_file:
          type: string
          description: 服务端实际使用的配置文件路径。
        content:
          type: string
          description: |
            config.json 的原文内容。包含 OAuth Token、Cookie 等敏感凭证，
            仅对已认证请求返回，请勿写入日志、URL 或前端源码。

    ConfigFileUpdate:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          description: 完整的配置文件 JSON 内容，服务端校验通过后整体替换。

    ConfigUpdate:
      type: object
      additionalProperties: false
      properties:
        account_id:
          type: string
          description: 指定要更新或测试的本项目账号 id；省略时固定使用主账号，与页面展示账号无关。仅在测试接口中显式传空字符串表示独立新账号草稿，不继承主账号凭证或代理。
        app_api_key:
          type: string
          writeOnly: true
          description: 保护本地 API 接口的管理密钥，仅在服务端保存。
        access_token:
          type: string
          writeOnly: true
          description: ChatGPT OAuth Bearer Token，仅在服务端保存。
        cookie:
          type: string
          writeOnly: true
          description: ChatGPT Web Cookie，仅在服务端保存。
        chatgpt_account_id:
          type: string
        client_build_number:
          type: string
        client_version:
          type: string
        device_id:
          type: string
        session_id:
          type: string
        client_observation:
          type: string
        referer:
          type: string
        user_agent:
          type: string
        fedramp:
          type: boolean
        proxy_url:
          type: string
          description: 该账号的代理 URL，支持 http、https、socks5；空字符串明确选择直连。省略保持不变，地址不带认证时保留已有认证。
        proxy_username:
          type: string
          writeOnly: true
          description: 代理认证用户名。更改用户名时应同时提供新密码。
        proxy_password:
          type: string
          writeOnly: true
          description: 代理认证密码，支持特殊字符，无需 URL 编码。省略保留已有密码，空字符串明确设置空密码；响应不回显。
        proxy_clear_auth:
          type: boolean
          default: false
          description: 为 true 时清除该账号的代理认证，不能同时提供非空用户名或密码。
        cache_ttl:
          type: string
          description: Go duration，例如 10m、30s、0。
        basic_auth_enabled:
          type: boolean
        basic_auth_username:
          type: string
        basic_auth_password:
          type: string
          writeOnly: true

    ConfigTestResult:
      type: object
      required:
        - ok
        - message
        - status_code
        - token_configured
        - cookie_configured
      properties:
        ok:
          type: boolean
        message:
          type: string
        status_code:
          type: integer
          example: 200
        email:
          type: string
        plan_type:
          type: string
        token_configured:
          type: boolean
        cookie_configured:
          type: boolean

    ProxyTestRequest:
      type: object
      additionalProperties: false
      properties:
        account_id:
          type: string
          description: 指定账号；省略固定使用主账号，空字符串表示不继承已有代理或认证的新账号草稿。
        proxy_url:
          type: string
          description: 该账号的代理 URL，支持 http、https、socks5；空字符串明确选择直连。省略测试已保存的代理，地址不带认证时保留已有认证。
        proxy_username:
          type: string
          writeOnly: true
          description: 代理认证用户名。更改用户名时应同时提供新密码。
        proxy_password:
          type: string
          writeOnly: true
          description: 代理认证密码，支持特殊字符，无需 URL 编码。省略保留已有密码，空字符串明确设置空密码；响应不回显。
        proxy_clear_auth:
          type: boolean
          default: false
          description: 为 true 时清除该账号的代理认证，不能同时提供非空用户名或密码。

    ProxyTestResult:
      type: object
      required:
        - ok
        - message
        - status_code
      properties:
        ok:
          type: boolean
        message:
          type: string
        status_code:
          type: integer
