name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 v1.0.2"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.22.x'

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update Compose and create release tag
        id: prepare
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号必须符合 vMAJOR.MINOR.PATCH，例如 v1.0.2"
            exit 1
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "版本标签 ${RELEASE_VERSION} 已存在"
            exit 1
          fi
          sed -i -E "s|^(    image: ghcr.io/xyzphp/codexmeter:).*$|\1${RELEASE_VERSION}|" docker-compose.yml
          if ! git diff --quiet -- docker-compose.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docker-compose.yml
            git commit -m "chore: pin Docker Compose image to ${RELEASE_VERSION}"
            git push origin HEAD:main
          fi
          commit_sha="$(git rev-parse HEAD)"
          git tag "${RELEASE_VERSION}" "${commit_sha}"
          git push origin "${RELEASE_VERSION}"
          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: 运行测试
        run: go test ./...
      - name: 运行静态检查
        run: go vet ./...

  build:
    name: Build ${{ matrix.name }}
    needs: [prepare-release, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            extension: .exe
            archive: zip
          - name: linux-amd64
            goos: linux
            goarch: amd64
            extension: ''
            archive: tar.gz
          - name: linux-arm64
            goos: linux
            goarch: arm64
            extension: ''
            archive: tar.gz
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: 构建发布包
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          package_name="codex-meter-${{ matrix.name }}"
          package_dir="package/${package_name}"
          mkdir -p "dist" "${package_dir}"
          go build -trimpath -ldflags="-s -w" -o "${package_dir}/codex-meter${{ matrix.extension }}" .
          cp README.md config.example.json openapi.yaml docker-compose.yml "${package_dir}/"
          mkdir -p "${package_dir}/docs"
          cp docs/openapi.md docs/openai-config.md docs/frontend-ui.md docs/github-actions.md docs/docker.md "${package_dir}/docs/"
          cp -R docs/media "${package_dir}/docs/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd package && zip -r "../dist/${package_name}.zip" "${package_name}")
          else
            tar -C package -czf "dist/${package_name}.tar.gz" "${package_name}"
          fi
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: codex-meter-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  docker:
    name: Docker image
    needs: [prepare-release, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build --pull --tag codex-meter:ci .

  docker-publish:
    name: Publish Docker image
    needs: [prepare-release, test, docker, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xyzphp/codexmeter
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
            type=raw,value=latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    needs: [prepare-release, build, docker]
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: codex-meter-*
          path: release-files
          merge-multiple: true
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit_sha }}
        run: |
          gh release create "${RELEASE_VERSION}" release-files/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_COMMIT}" \
            --title "Codex Meter ${RELEASE_VERSION}" \
            --generate-notes
